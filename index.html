<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f8ff">
    <meta name="description" content="小学校1年生から6年生まで、学年に合った計算問題に楽しく挑戦できます。">
    <title>まなび計算チャレンジ</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="page-header">
        <div class="brand-mark" aria-hidden="true">＋</div>
        <div>
          <p class="eyebrow">まいにち ちょっとずつ</p>
          <h1>まなび計算チャレンジ</h1>
        </div>
      </header>

      <section class="practice-card" aria-labelledby="practice-title">
        <div class="card-heading">
          <div>
            <p class="eyebrow">きょうの計算</p>
            <h2 id="practice-title">学年をえらぼう</h2>
          </div>
          <div class="score" aria-label="正解した問題数">
            <span class="score-icon" aria-hidden="true">★</span>
            <span><strong id="score">0</strong><span class="score-unit">もん正解</span></span>
          </div>
        </div>

        <label class="grade-label" for="grade">学年</label>
        <select id="grade" name="grade">
          <option value="1">1年生</option>
          <option value="2">2年生</option>
          <option value="3">3年生</option>
          <option value="4">4年生</option>
          <option value="5">5年生</option>
          <option value="6">6年生</option>
        </select>

        <div class="question-panel" aria-live="polite" aria-atomic="true">
          <p id="question-label" class="question-label">もんだい 1</p>
          <p id="question" class="question">じゅんび中…</p>
        </div>

        <form id="answer-form" novalidate>
          <label for="answer" class="answer-label">こたえ</label>
          <div class="answer-row">
            <input
              id="answer"
              name="answer"
              type="text"
              inputmode="text"
              autocomplete="off"
              placeholder="こたえを入力"
              aria-describedby="answer-help feedback"
              required
            >
            <button class="button button-check" type="submit">こたえ合わせ</button>
          </div>
          <p id="answer-help" class="help-text">こたえを入力して「こたえ合わせ」をおそう</p>
        </form>

        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        <button id="next-question" class="button button-next" type="button" disabled>次の問題へ <span aria-hidden="true">→</span></button>
      </section>
      <footer>あせらず、自分のペースでやってみよう！</footer>
    </main>
  </body>
</html>
